name: Build

on:
  push:
  pull_request:

jobs:
  macos-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build iSnap
        run: |
          xcodebuild \
            -project iSnap.xcodeproj \
            -scheme iSnap \
            -configuration Debug \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Preview regression checks
        run: |
          mkdir -p .build/preview-artifacts
          xcrun swiftc -swift-version 5 -o .build/preview-regression \
            iSnap/AnnotationCanvasView.swift \
            iSnap/PreviewWindowController.swift \
            Tests/PreviewRegression.swift
          PREVIEW_ARTIFACT_DIR=.build/preview-artifacts .build/preview-regression
      - name: Upload preview snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-snapshots
          path: .build/preview-artifacts
          if-no-files-found: ignore
